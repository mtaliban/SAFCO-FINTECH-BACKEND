# Eclipse Mosquitto - SAFCO LMS local MQTT broker
# Two listeners: plain MQTT for backend workers, and WebSocket for browsers.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all

# Native MQTT (used by Laravel via php-mqtt/client)
listener 1883
protocol mqtt

# MQTT over WebSockets (used by frontend browser clients)
listener 9001
protocol websockets

# Dev: allow anonymous. Production: switch to password_file.
allow_anonymous true

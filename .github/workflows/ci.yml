name: CI - Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, redis, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy .env
        run: cp .env.example .env && php artisan key:generate

      - name: Laravel Pint (formatting)
        run: ./vendor/bin/pint --test

      - name: PHPStan / Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

  test:
    name: Tests (PHPUnit / Pest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: safco_lms_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports: [6379:6379]

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: [5672:5672, 15672:15672]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, redis, bcmath, gd, zip, sockets
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy .env
        run: cp .env.example .env && php artisan key:generate

      - name: Set test env
        run: |
          sed -i 's|DB_HOST=mysql|DB_HOST=127.0.0.1|g' .env
          sed -i 's|DB_DATABASE=safco_lms|DB_DATABASE=safco_lms_test|g' .env
          sed -i 's|DB_USERNAME=safco_user|DB_USERNAME=root|g' .env
          sed -i 's|DB_PASSWORD=safco_secret_2026|DB_PASSWORD=root|g' .env
          sed -i 's|REDIS_HOST=redis|REDIS_HOST=127.0.0.1|g' .env
          sed -i 's|RABBITMQ_HOST=rabbitmq|RABBITMQ_HOST=127.0.0.1|g' .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: ./vendor/bin/pest --coverage --min=60

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Composer audit
        run: composer audit

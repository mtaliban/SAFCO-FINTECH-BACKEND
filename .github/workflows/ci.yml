########################################################
# SAFCO FINTECH LMS - Backend CI
#
# Runs on every push + PR. Must PASS before CD workflow
# is triggered (CD listens for `workflow_run` completion).
########################################################
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: PHPUnit · Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip, sockets, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs

      - name: Prepare .env for testing
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --testdox

      - name: Laravel Pint (code style, non-blocking)
        continue-on-error: true
        run: ./vendor/bin/pint --test

name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  DOCKER_IMAGE: safcofintech/lms-backend

jobs:
  docker-build:
    name: Docker build (verify Dockerfile works)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Setup PHP 8.4 (host-side composer install so Dockerfile can COPY vendor/)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, redis, bcmath, gd, zip, sockets
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs

      - name: Build Docker image (verify build succeeds)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-to-dockerhub:
    name: Push image to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    # Only runs if the DOCKERHUB_USERNAME secret has been added to the repo.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: check
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "have_creds=true" >> $GITHUB_OUTPUT
          else
            echo "have_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not configured — skipping push."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.have_creds == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check.outputs.have_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup PHP + composer
        if: steps.check.outputs.have_creds == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install PHP dependencies
        if: steps.check.outputs.have_creds == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs

      - name: Extract metadata
        if: steps.check.outputs.have_creds == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        if: steps.check.outputs.have_creds == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

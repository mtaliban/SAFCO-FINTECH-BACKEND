########################################################
# SAFCO FINTECH LMS - Backend Continuous Deployment
#
# Triggered by CI workflow completion on main branch.
# Runs ONLY if CI passed. Does:
#   1. Build production Docker image
#   2. Push to Docker Hub (mtalibani/safco-backend)
#   3. SSH into EC2, generate .env, pull image, deploy
#   4. Health-check
########################################################
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: mtalibani/safco-backend
  DEPLOY_PATH: /home/ubuntu/safco-backend

jobs:
  ##########################################
  # 1. Build + push Docker image
  ##########################################
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=11 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Setup PHP 8.4 for Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction --ignore-platform-reqs

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  ##########################################
  # 2. Deploy to EC2 (native ssh via ssh-agent)
  ##########################################
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      IMAGE_TAG: sha-${{ needs.build-and-push.outputs.short_sha }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Write the SSH private key to ~/.ssh/id_rsa. Tries base64 decode
      # first (if secret is base64), falls back to raw PEM. Also normalizes
      # line endings (CRLF → LF) and ensures a trailing newline.
      - name: Setup SSH key
        env:
          KEY_RAW: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh

          # Prefer base64 secret if present, else use raw PEM.
          if [ -n "$KEY_B64" ]; then
            echo "Using EC2_SSH_KEY_B64 secret"
            printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_rsa
          elif [ -n "$KEY_RAW" ]; then
            echo "Using EC2_SSH_KEY secret (raw PEM)"
            # Strip CR (Windows line-endings) and ensure trailing newline.
            printf '%s\n' "$KEY_RAW" | tr -d '\r' > ~/.ssh/id_rsa
          else
            echo "!! Neither EC2_SSH_KEY nor EC2_SSH_KEY_B64 secret is set." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_rsa

          size=$(wc -c < ~/.ssh/id_rsa)
          echo "Key file size: ${size} bytes"
          echo "First line: $(head -1 ~/.ssh/id_rsa)"
          echo "Last line:  $(tail -1 ~/.ssh/id_rsa)"

          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "!! Key is not a valid OpenSSH private key after normalization." >&2
            exit 1
          fi
          echo "Key parsed OK."

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure Docker installed on EC2
        run: |
          ssh "$EC2_USER@$EC2_HOST" '
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              echo "==> Installing Docker Engine ..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker "$USER"
              sudo systemctl enable --now docker
            fi
            mkdir -p '"$DEPLOY_PATH"'
          '

      - name: Docker login on EC2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "echo '$DOCKER_TOKEN' | sudo docker login -u '$DOCKER_USERNAME' --password-stdin"

      - name: Copy compose file + deploy script to EC2
        run: |
          scp docker-compose.prod.yml deploy.sh "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/"

      - name: Generate .env on EC2 from GitHub secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET: ${{ secrets.REVERB_APP_SECRET }}
          CERTIFICATE_SIGNING_KEY: ${{ secrets.CERTIFICATE_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
        run: |
          # Build .env locally, then transfer via scp. Safer than heredoc-over-ssh
          # because we avoid double-escaping.
          cat > env.production <<ENVEOF
          # Generated by GitHub Actions on every deploy — do NOT edit by hand.
          APP_NAME="SAFCO FINTECH LMS"
          APP_ENV=production
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_TIMEZONE=Africa/Dar_es_Salaam
          APP_URL=${APP_URL}
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en

          API_VERSION=v1
          API_PREFIX=api
          FRONTEND_URL=${FRONTEND_URL}

          LOG_CHANNEL=stack
          LOG_LEVEL=warning
          LOG_STACK=daily

          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=safco_lms
          DB_USERNAME=safco_user
          DB_PASSWORD=${DB_PASSWORD}
          DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}

          CACHE_STORE=redis
          SESSION_DRIVER=redis
          SESSION_LIFETIME=120
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=null
          REDIS_CLIENT=predis

          QUEUE_CONNECTION=redis
          HORIZON_PREFIX=safco_horizon

          BROADCAST_CONNECTION=reverb
          REVERB_APP_ID=safco-lms
          REVERB_APP_KEY=${REVERB_APP_KEY}
          REVERB_APP_SECRET=${REVERB_APP_SECRET}
          REVERB_HOST=reverb
          REVERB_PORT=8080
          REVERB_SCHEME=http
          REVERB_SERVER_HOST=0.0.0.0

          MAIL_MAILER=smtp
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=Hamisiselemani039@gmail.com
          MAIL_PASSWORD=${MAIL_PASSWORD}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=Hamisiselemani039@gmail.com
          MAIL_FROM_NAME="SAFCO FINTECH LMS"

          FILESYSTEM_DISK=s3
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
          AWS_BUCKET=${AWS_BUCKET}
          AWS_URL=https://${AWS_BUCKET}.s3.${AWS_DEFAULT_REGION}.amazonaws.com
          AWS_ENDPOINT=
          AWS_USE_PATH_STYLE_ENDPOINT=false
          BACKUP_DISK=s3
          AWS_BACKUP_BUCKET=${AWS_BUCKET}

          AI_TUTOR_PROVIDER=openrouter
          AI_QUESTION_PROVIDER=openrouter
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=gemini-1.5-flash
          GEMINI_TIMEOUT=60

          GROQ_API_KEY=${GROQ_API_KEY}
          GROQ_MODEL=llama-3.1-8b-instant

          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          OPENROUTER_MODEL=meta-llama/llama-3.1-8b-instruct

          SANCTUM_TOKEN_EXPIRATION=86400
          SESSION_SECURE_COOKIE=false
          SESSION_ENCRYPT=false
          SESSION_SAME_SITE=lax
          CORS_ALLOWED_ORIGINS=${FRONTEND_URL}
          CERTIFICATE_SIGNING_KEY=${CERTIFICATE_SIGNING_KEY}

          RATE_LIMIT_API=60
          RATE_LIMIT_AUTH=5
          RATE_LIMIT_OTP=3

          ACTIVITY_LOG_ENABLED=true

          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          GOOGLE_REDIRECT_URI=${APP_URL}/api/v1/auth/social/google/callback

          MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
          MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
          MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
          MICROSOFT_REDIRECT_URI=${APP_URL}/api/v1/auth/social/microsoft/callback
          ENVEOF

          scp env.production "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/.env"
          ssh "$EC2_USER@$EC2_HOST" "chmod 600 $DEPLOY_PATH/.env"
          rm -f env.production

      - name: Run deploy script on EC2
        run: |
          ssh "$EC2_USER@$EC2_HOST" "cd $DEPLOY_PATH && chmod +x deploy.sh && sudo ./deploy.sh $DOCKER_IMAGE $IMAGE_TAG"

      - name: Smoke-test health endpoint
        run: |
          echo "Waiting 20s for the app to warm up..."
          sleep 20
          for attempt in 1 2 3 4 5; do
            code=$(curl -sfk -o /dev/null -w "%{http_code}" "http://$EC2_HOST:8000/api/v1/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "OK: /api/v1/health returned 200 on attempt $attempt."
              exit 0
            fi
            echo "attempt $attempt: got HTTP $code — retrying in 10s..."
            sleep 10
          done
          echo "!! Health endpoint never returned 200. Check EC2 logs: docker compose logs app" >&2
          exit 1

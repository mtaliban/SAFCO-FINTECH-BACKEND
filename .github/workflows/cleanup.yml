name: Cleanup EC2 Disk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup.yml'

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          KEY_RAW: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY_B64" ]; then
            printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s\n' "$KEY_RAW" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fix containerd + pull missing images + free disk
        run: |
          ssh "$EC2_USER@$EC2_HOST" << 'SSHEOF'
            echo "=== Disk before ==="
            df -h /

            echo "=== Restart containerd to clear corrupt snapshots ==="
            sudo systemctl restart containerd
            sleep 5
            sudo systemctl restart docker
            sleep 8

            echo "=== Pull back mysql + redis if missing ==="
            sudo docker image inspect mysql:8.0 >/dev/null 2>&1 || sudo docker pull mysql:8.0
            sudo docker image inspect redis:7-alpine >/dev/null 2>&1 || sudo docker pull redis:7-alpine

            echo "=== Remove old safco-backend sha- images (keep latest 2) ==="
            sudo docker images mtalibani/safco-backend --format "{{.ID}} {{.Tag}}" | grep "sha-" | tail -n +3 | awk '{print $1}' | xargs -r sudo docker rmi -f 2>/dev/null || true

            echo "=== Remove only dangling layers ==="
            sudo docker image prune -f

            echo "=== Journal + apt cache ==="
            sudo journalctl --vacuum-size=30M 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true

            echo "=== Disk after ==="
            df -h /

            echo "=== Running containers ==="
            sudo docker ps --format "{{.Names}} {{.Status}}"
          SSHEOF

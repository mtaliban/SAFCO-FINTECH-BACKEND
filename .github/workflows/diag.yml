name: Diagnose AI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag.yml'

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          KEY_RAW: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY_B64" ]; then
            printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s\n' "$KEY_RAW" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test AI end-to-end
        run: |
          ssh "$EC2_USER@$EC2_HOST" << 'SSHEOF'
            CONTAINER=$(sudo docker ps -qf name=app | head -1)
            DB_CONTAINER=$(sudo docker ps -qf name=mysql | head -1)
            DB_PASS=$(sudo docker exec $CONTAINER printenv DB_PASSWORD)

            echo "=== Step 1: Login (OTP triggered) ==="
            curl -s -X POST http://localhost:8000/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d '{"identifier":"yustino.nyendeza@safcofintech.co.tz","password":"Trainer@2026!"}'
            echo ""
            sleep 3

            echo "=== Step 2: OTP from DB ==="
            OTP=$(sudo docker exec $DB_CONTAINER mysql -u safco_user -p"$DB_PASS" safco_lms \
              -se "SELECT code FROM otp_codes WHERE user_id=(SELECT id FROM users WHERE email='yustino.nyendeza@safcofintech.co.tz') ORDER BY created_at DESC LIMIT 1;" 2>/dev/null)
            echo "OTP: $OTP"

            echo "=== Step 3: Verify OTP ==="
            VERIFY=$(curl -s -X POST http://localhost:8000/api/v1/auth/login/verify \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{\"email\":\"yustino.nyendeza@safcofintech.co.tz\",\"code\":\"$OTP\"}")
            echo "$VERIFY" | head -c 200
            echo ""
            TOKEN=$(echo "$VERIFY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('token','NO_TOKEN'))" 2>/dev/null)
            echo "Token: ${TOKEN:0:25}..."

            echo "=== Step 4a: Check env vars in container ==="
            OR_KEY=$(sudo docker exec $CONTAINER printenv OPENROUTER_API_KEY 2>/dev/null || echo "MISSING")
            OR_MODEL=$(sudo docker exec $CONTAINER printenv OPENROUTER_MODEL 2>/dev/null || echo "MISSING")
            AI_PROV=$(sudo docker exec $CONTAINER printenv AI_QUESTION_PROVIDER 2>/dev/null || echo "MISSING")
            echo "AI_QUESTION_PROVIDER=$AI_PROV"
            echo "OPENROUTER_MODEL=$OR_MODEL"
            echo "OPENROUTER_API_KEY starts_with=${OR_KEY:0:12}..."

            echo "=== Step 4b: Find working free OpenRouter model ==="
            for TEST_MODEL in "google/gemini-2.0-flash-exp:free" "meta-llama/llama-3.2-3b-instruct:free" "qwen/qwen-2.5-7b-instruct:free" "mistralai/mistral-7b-instruct:free" "nousresearch/hermes-3-llama-3.1-405b:free"; do
              RES=$(curl -s -X POST https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer $OR_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"$TEST_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"reply with the single word OK\"}],\"max_tokens\":5}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK:'+d.get('choices',[{}])[0].get('message',{}).get('content','')) if d.get('choices') else print('ERR:'+d.get('error',{}).get('message','?')[:80])" 2>/dev/null)
              echo "$TEST_MODEL => $RES"
              if echo "$RES" | grep -q "^OK:"; then
                echo "WINNER=$TEST_MODEL"
                break
              fi
            done
            echo ""

            echo "=== Step 4c: AI Generate via backend ==="
            AI_RESP=$(curl -s -X POST http://localhost:8000/api/v1/ai/generate-questions \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d '{"source_type":"topic","topic":"basic accounting","question_type":"multiple_choice","count":3,"difficulty":"easy","language":"en"}')
            echo "$AI_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); qs=d.get('data',{}).get('questions',[]); [print('AI INAFANYA KAZI! Questions: '+str(len(qs))), [print('  Q'+str(i+1)+': '+q.get('text','')[:80]) for i,q in enumerate(qs)]] if qs else print('AI IMEFELI: '+d.get('message','unknown'))" 2>/dev/null || echo "$AI_RESP" | head -c 400

            echo "=== Step 4d: Recent app error logs ==="
            sudo docker logs $CONTAINER --tail=30 2>&1 | grep -i "openrouter\|ai\|error\|exception" | tail -15
          SSHEOF

name: Diagnose AI
on:
  workflow_dispatch:

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          KEY_RAW: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY_B64" ]; then
            printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s\n' "$KEY_RAW" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Read AI error logs
        run: |
          ssh "$EC2_USER@$EC2_HOST" '
            CONTAINER=$(sudo docker ps -qf name=app | head -1)
            echo "=== Container: $CONTAINER ==="
            echo ""
            echo "=== AI env vars (keys truncated) ==="
            sudo docker exec $CONTAINER printenv | grep -E "^(AI_|GEMINI_|GROQ_|OPENROUTER_)" | sed "s/=\(.\{8\}\).*/=\1.../"
            echo ""
            echo "=== Today Laravel log (last 100 lines) ==="
            sudo docker exec $CONTAINER sh -c "tail -n 100 storage/logs/laravel-$(date +%Y-%m-%d).log 2>/dev/null || tail -n 100 storage/logs/laravel.log 2>/dev/null || echo NO_LOG_FILE"
            echo ""
            echo "=== Test Groq API directly ==="
            GROQ_KEY=$(sudo docker exec $CONTAINER printenv GROQ_API_KEY)
            GROQ_MODEL=$(sudo docker exec $CONTAINER printenv GROQ_MODEL)
            curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST https://api.groq.com/openai/v1/chat/completions \
              -H "Authorization: Bearer $GROQ_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$GROQ_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Say OK\"}],\"max_tokens\":5}" | tail -3
          '

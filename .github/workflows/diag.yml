name: Diagnose AI
on:
  workflow_dispatch:

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          KEY_RAW: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY_B64" ]; then
            printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s\n' "$KEY_RAW" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test AI end-to-end
        run: |
          ssh "$EC2_USER@$EC2_HOST" '
            CONTAINER=$(sudo docker ps -qf name=app | head -1)
            DB_CONTAINER=$(sudo docker ps -qf name=mysql | head -1)

            echo "=== Step 1: Trigger login (sends OTP) ==="
            curl -s -X POST http://localhost:8000/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{\"identifier\":\"yustino.nyendeza@safcofintech.co.tz\",\"password\":\"Trainer@2026!\"}" | cat
            echo ""

            echo "=== Step 2: Get OTP from database ==="
            sleep 2
            OTP=$(sudo docker exec $DB_CONTAINER mysql -u safco_user -p"$(sudo docker exec $CONTAINER printenv DB_PASSWORD)" safco_lms \
              -se "SELECT code FROM otp_codes WHERE user_id=(SELECT id FROM users WHERE email='yustino.nyendeza@safcofintech.co.tz') ORDER BY created_at DESC LIMIT 1;" 2>/dev/null)
            echo "OTP: $OTP"

            echo "=== Step 3: Verify OTP and get token ==="
            TOKEN=$(curl -s -X POST http://localhost:8000/api/v1/auth/verify-otp \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{\"email\":\"yustino.nyendeza@safcofintech.co.tz\",\"code\":\"$OTP\"}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get(\"data\",{}).get(\"token\",\"NO_TOKEN\"))" 2>/dev/null)
            echo "Token: ${TOKEN:0:20}..."

            echo "=== Step 4: Test AI generate ==="
            curl -s -X POST http://localhost:8000/api/v1/ai/generate-questions \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{\"source_type\":\"topic\",\"topic\":\"basic accounting\",\"question_type\":\"multiple_choice\",\"count\":3,\"difficulty\":\"easy\",\"language\":\"en\"}" \
              | python3 -c "
import sys,json
d=json.load(sys.stdin)
qs=d.get(\"data\",{}).get(\"questions\",[])
if qs:
    print(f\"AI INAFANYA KAZI! Questions: {len(qs)}\")
    for i,q in enumerate(qs): print(f\"  Q{i+1}: {q[\"text\"][:80]}\")
else:
    print(\"AI IMEFELI:\", d.get(\"message\",\"unknown\"))
" 2>/dev/null
          '

name: Diagnose AI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag.yml'

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          KEY_RAW: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY_B64" ]; then
            printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s\n' "$KEY_RAW" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test all AI providers
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PARSE='import sys,json; d=json.load(sys.stdin); print("WORKS: "+d["choices"][0]["message"]["content"][:30]) if d.get("choices") else print("FAIL: "+str(d)[:100])'

          echo "--- GROQ ---"
          for MODEL in "llama-3.1-8b-instant" "llama-3.2-3b-preview" "gemma2-9b-it"; do
            echo -n "groq/$MODEL => "
            curl -s https://api.groq.com/openai/v1/chat/completions \
              -H "Authorization: Bearer $GROQ_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"say ok\"}],\"max_tokens\":5}" \
              | python3 -c "$PARSE" 2>/dev/null || echo "PARSE_ERROR"
          done

          echo "--- GEMINI direct ---"
          echo -n "gemini-1.5-flash => "
          curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_KEY" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"say ok"}]}]}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); c=d.get('candidates',[]); print('WORKS: '+c[0]['content']['parts'][0]['text'][:30]) if c else print('FAIL: '+str(d.get('error',d))[:100])" 2>/dev/null || echo "PARSE_ERROR"

          echo "--- OPENROUTER (paid models) ---"
          for MODEL in "meta-llama/llama-3.1-8b-instruct" "google/gemini-flash-1.5" "mistralai/mistral-7b-instruct"; do
            echo -n "$MODEL => "
            curl -s https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OR_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"say ok\"}],\"max_tokens\":5}" \
              | python3 -c "$PARSE" 2>/dev/null || echo "PARSE_ERROR"
          done

      - name: Test AI end-to-end on EC2
        run: |
          ssh "$EC2_USER@$EC2_HOST" << 'SSHEOF'
            CONTAINER=$(sudo docker ps -qf name=app | head -1)
            DB_CONTAINER=$(sudo docker ps -qf name=mysql | head -1)
            DB_PASS=$(sudo docker exec $CONTAINER printenv DB_PASSWORD)

            echo "=== Step 1: Login ==="
            curl -s -X POST http://localhost:8000/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d '{"identifier":"yustino.nyendeza@safcofintech.co.tz","password":"Trainer@2026!"}'
            echo ""
            sleep 3

            echo "=== Step 2: OTP from DB ==="
            OTP=$(sudo docker exec $DB_CONTAINER mysql -u safco_user -p"$DB_PASS" safco_lms \
              -se "SELECT code FROM otp_codes WHERE user_id=(SELECT id FROM users WHERE email='yustino.nyendeza@safcofintech.co.tz') ORDER BY created_at DESC LIMIT 1;" 2>/dev/null)
            echo "OTP: $OTP"

            echo "=== Step 3: Verify OTP ==="
            VERIFY=$(curl -s -X POST http://localhost:8000/api/v1/auth/login/verify \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{\"email\":\"yustino.nyendeza@safcofintech.co.tz\",\"code\":\"$OTP\"}")
            TOKEN=$(echo "$VERIFY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('token','NO_TOKEN'))" 2>/dev/null)
            echo "Token: ${TOKEN:0:25}..."

            echo "=== Step 4: AI Generate Questions ==="
            AI_RESP=$(curl -s -X POST http://localhost:8000/api/v1/ai/generate-questions \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d '{"source_type":"topic","topic":"basic accounting","question_type":"multiple_choice","count":3,"difficulty":"easy","language":"en"}')
            echo "$AI_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); qs=d.get('data',{}).get('questions',[]); [print('AI INAFANYA KAZI! Questions: '+str(len(qs))), [print('  Q'+str(i+1)+': '+q.get('text','')[:80]) for i,q in enumerate(qs)]] if qs else print('AI IMEFELI: '+d.get('message','unknown'))" 2>/dev/null || echo "$AI_RESP" | head -c 400

            echo "=== Step 5: Backend logs (openrouter errors) ==="
            sudo docker logs $CONTAINER --tail=20 2>&1 | grep -i "openrouter\|AiException\|request_failed" | tail -10
          SSHEOF

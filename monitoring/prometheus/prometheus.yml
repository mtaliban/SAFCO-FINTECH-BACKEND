global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "safco-lms-monitor"
    environment: "production"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "safco-lms-app"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["app:80"]
    scrape_interval: 15s

  - job_name: "mysql"
    static_configs:
      - targets: ["mysql:9104"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:9121"]

  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

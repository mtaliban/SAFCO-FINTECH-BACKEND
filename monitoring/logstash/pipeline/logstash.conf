input {
  beats {
    port => 5044
  }

  # Ingest Laravel JSON logs directly (from Docker stdout)
  tcp {
    port => 5000
    codec => json_lines
    tags => ["laravel"]
  }
}

filter {
  if "laravel" in [tags] {
    # Parse Laravel structured JSON logs
    date {
      match => ["datetime", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      add_field => {
        "app" => "safco-lms"
        "environment" => "%{[extra][env]}"
      }
    }
  }

  # Enrich with GeoIP for login events
  if [event_name] == "user.logged_in" or [event_name] == "user.login_failed" {
    geoip {
      source => "[payload][ip_address]"
      target => "geoip"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "safco-lms-%{+YYYY.MM.dd}"
    action => "index"
  }

  # Debug output (comment out in production)
  # stdout { codec => rubydebug }
}

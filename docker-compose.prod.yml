########################################################
# SAFCO FINTECH LMS - Production Stack (EC2)
#
# Pulls pre-built image from Docker Hub (no local build).
# Ships only the essential services — heavy dev tools
# (elasticsearch, kibana, grafana, mailhog) are omitted.
#
# Usage on EC2:
#   docker login -u mtalibani -p <DOCKER_TOKEN>
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
########################################################
version: "3.9"

networks:
  safco:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

services:
  #######################################
  # APPLICATION (Laravel 12 / PHP 8.4)
  #######################################
  app:
    image: ${DOCKER_IMAGE:-mtalibani/safco-backend}:${IMAGE_TAG:-latest}
    container_name: safco-app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      # Persist uploaded files that aren't on S3 (temp/cache/logs).
      - ./storage/logs:/var/www/html/storage/logs
      - ./storage/framework:/var/www/html/storage/framework
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - safco

  #######################################
  # QUEUE WORKER
  #######################################
  worker:
    image: ${DOCKER_IMAGE:-mtalibani/safco-backend}:${IMAGE_TAG:-latest}
    container_name: safco-worker
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work --queue=emails,sms,notifications-high,notifications,media,security,analytics,event-bus,default --tries=5 --max-jobs=1000 --max-time=3600
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_started
    networks:
      - safco

  #######################################
  # REVERB (WebSocket server)
  #######################################
  reverb:
    image: ${DOCKER_IMAGE:-mtalibani/safco-backend}:${IMAGE_TAG:-latest}
    container_name: safco-reverb
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_started
    networks:
      - safco

  #######################################
  # SCHEDULER (cron via loop)
  #######################################
  scheduler:
    image: ${DOCKER_IMAGE:-mtalibani/safco-backend}:${IMAGE_TAG:-latest}
    container_name: safco-scheduler
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      app:
        condition: service_started
    networks:
      - safco

  #######################################
  # DATABASE - MySQL 8
  #######################################
  mysql:
    image: mysql:8.0
    container_name: safco-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - safco

  #######################################
  # REDIS - Cache, Queue, Sessions
  #######################################
  redis:
    image: redis:7-alpine
    container_name: safco-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - safco
